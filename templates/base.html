<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Rezervem{% endblock %}</title>
    <style>
        :root {
            --bg: #f6f4ef;
            --text: #2f2f31;
            --muted: #6f6f73;
            --line: #dfd8c8;
            --primary: #0f6b4b;
            --primary-dark: #0a543b;
            --panel: #ffffff;
            --danger: #c92a2a;
            --success: #2b8a3e;
            --gold: #b4a24e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .topbar {
            background: #0f3d2e;
            color: white;
            padding: 16px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
        }

        .brand {
            font-size: 24px;
            font-weight: 800;
        }

        .nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav a, .nav button {
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            padding: 9px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .nav a:hover, .nav button:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        .page {
            width: min(1120px, calc(100% - 32px));
            margin: 26px auto;
        }

        .hero {
            background: linear-gradient(135deg, #ffffff, #f8f2dc);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 28px;
            margin-bottom: 18px;
        }

        .hero h1 {
            margin: 0 0 8px;
            font-size: 34px;
        }

        .hero p {
            margin: 0;
            color: var(--muted);
            max-width: 700px;
            line-height: 1.5;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 20px;
        }

        .panel h2 {
            margin: 0 0 14px;
            font-size: 22px;
        }

        .muted {
            color: var(--muted);
        }

        label {
            display: block;
            margin-top: 12px;
            font-size: 14px;
            font-weight: 700;
        }

        input, textarea, select {
            width: 100%;
            margin-top: 6px;
            padding: 11px;
            border: 1px solid #bcccdc;
            border-radius: 6px;
            font-size: 15px;
            background: white;
        }

        textarea {
            min-height: 96px;
            resize: vertical;
        }

        .button-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .btn {
            border: 0;
            border-radius: 6px;
            background: var(--primary);
            color: white;
            padding: 11px 14px;
            cursor: pointer;
            font-weight: 700;
            display: inline-block;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .btn.secondary {
            background: #486581;
        }

        .message {
            margin-top: 14px;
            padding: 11px;
            border-radius: 6px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: #fff5f5;
            color: var(--danger);
            border: 1px solid #ffc9c9;
        }

        .message.success {
            background: #ebfbee;
            color: var(--success);
            border: 1px solid #b2f2bb;
        }

        .list {
            display: grid;
            gap: 10px;
        }

        .item {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 14px;
            background: white;
        }

        .item.active-reservation {
            background: #f4fbf6;
            border-color: #ccebd6;
        }

        .item.cancelled-reservation {
            background: #f5f5f5;
            border-color: #dddddd;
            color: #777777;
        }

        .item-title {
            font-weight: 800;
            margin-bottom: 6px;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 999px;
            background: #e7f5ef;
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
        }

        .event-box {
            min-height: 260px;
            background: #102a43;
            color: #d9e2ec;
            border-radius: 8px;
            padding: 14px;
            overflow: auto;
            white-space: pre-wrap;
            line-height: 1.45;
        }

        .slot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-top: 14px;
        }

        .slot-status {
            min-height: 22px;
            margin-top: 12px;
            color: var(--muted);
            font-weight: 700;
            text-align: center;
        }

        .slot-card {
            border: 2px solid var(--line);
            border-radius: 8px;
            background: white;
            padding: 18px;
            cursor: pointer;
            text-align: center;
        }

        .slot-card strong {
            display: block;
            font-size: 22px;
            margin-bottom: 6px;
        }

        .slot-card.selected {
            border-color: var(--primary);
            background: #e7f5ef;
        }

        .slot-card.held {
            border-color: #d8c46a;
            background: #fffbea;
            color: #6f5f00;
            cursor: not-allowed;
        }

        .slot-card.held.selected {
            border-color: var(--primary);
            background: #e7f5ef;
            color: var(--text);
        }

        .slot-card.full {
            color: #9b9b9b;
            background: #f2f2f2;
            cursor: not-allowed;
            opacity: 0.75;
        }

        .steps {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            border-bottom: 2px solid var(--line);
            margin-bottom: 22px;
            text-align: center;
        }

        .step {
            padding: 10px;
            color: #9b9b9b;
            font-weight: 800;
        }

        .step.active {
            color: var(--primary);
            border-bottom: 3px solid var(--gold);
            margin-bottom: -2px;
        }

        .step.clickable {
            cursor: pointer;
        }

        .calendar-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 20px 0;
        }

        .calendar-title {
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            flex: 1;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .day-name {
            text-align: center;
            font-weight: 800;
            padding: 10px 0;
        }

        .day-btn {
            border: 0;
            border-radius: 999px;
            background: transparent;
            min-height: 48px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }

        .day-btn:hover {
            background: #edf7f1;
        }

        .day-btn.selected {
            background: var(--primary);
            color: white;
        }

        .day-btn.today {
            background: var(--gold);
            color: white;
        }

        .day-btn.muted-day {
            color: #b6b6b6;
        }

        .day-btn.past {
            color: #cfcfcf;
            cursor: not-allowed;
        }

        .wizard-pane {
            display: none;
        }

        .wizard-pane.active {
            display: block;
        }

        @media (max-width: 720px) {
            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .hero h1 {
                font-size: 28px;
            }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/">Rezervem</a>
        <nav class="nav">
            <a href="/">Home</a>
            <a href="/reservations/new/">Book a Table</a>
            <a href="/reservations/">My Reservations</a>
            <a href="/events/">Live Events</a>
            <a href="/manager/" id="managerLink">Admin Panel</a>
            <a href="/login/" id="loginLink">Login</a>
            <a href="/register/" id="registerLink">Register</a>
            <button id="logoutButton" type="button" onclick="logoutUser()">Logout</button>
        </nav>
    </header>

    <main class="page">
        {% block content %}{% endblock %}
    </main>

    <script>
        function getToken() {
            return localStorage.getItem("reservationToken") || "";
        }

        function saveToken(token) {
            localStorage.setItem("reservationToken", token);
            updateNav();
        }

        function saveUser(user) {
            localStorage.setItem("reservationUser", JSON.stringify(user));
            updateNav();
        }

        function getUser() {
            try {
                return JSON.parse(localStorage.getItem("reservationUser")) || {};
            } catch (error) {
                return {};
            }
        }

        function logoutUser() {
            localStorage.removeItem("reservationToken");
            localStorage.removeItem("reservationUser");
            window.location.href = "/login/";
        }

        function updateNav() {
            const loggedIn = Boolean(getToken());
            const isAdmin = getUser().role === "ADMIN";
            document.getElementById("logoutButton").style.display = loggedIn ? "inline-block" : "none";
            document.getElementById("loginLink").style.display = loggedIn ? "none" : "inline-block";
            document.getElementById("registerLink").style.display = loggedIn ? "none" : "inline-block";
            document.getElementById("managerLink").style.display = isAdmin ? "inline-block" : "none";
        }

        function authHeaders() {
            return {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + getToken()
            };
        }

        function showMessage(id, text, type) {
            const box = document.getElementById(id);
            if (!box) {
                return;
            }
            box.textContent = text;
            box.className = "message show " + type;
        }

        function requireLogin() {
            if (!getToken()) {
                window.location.href = "/login/";
                return false;
            }
            return true;
        }

        async function apiFetch(url, options) {
            const response = await fetch(url, options || {});
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || "Request failed.");
            }
            return data;
        }

        updateNav();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
